name: Daily Push Notifications

on:
  schedule:
    # ── Argentina (UTC-3) ──────────────────────────
    # 12:00 UTC = 09:00 mañana AR
    - cron: '0 12 * * *'
    # 17:00 UTC = 14:00 tarde AR
    - cron: '0 17 * * *'
    # 00:00 UTC = 21:00 noche AR
    - cron: '0 0 * * *'
    # ── Portugal (UTC+1 verano / UTC+0 invierno) ───
    # 08:00 UTC = 09:00 mañana PT (verano)
    - cron: '0 8 * * *'
    # 13:00 UTC = 14:00 tarde PT (verano)
    - cron: '0 13 * * *'
    # 20:00 UTC = 21:00 noche PT (verano)
    - cron: '0 20 * * *'
  workflow_dispatch: # permite correrlo manualmente para probar

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install web-push @supabase/supabase-js

      - name: Send daily notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/send-push.js
