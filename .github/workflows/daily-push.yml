name: Daily Push Notifications

on:
  schedule:
    # Cada slot filtra por TZ del usuario — solo dispara si es su hora local correcta
    - cron: '0 7 * * *'    # EU mañana → 8am Portugal verano / 7am invierno
    - cron: '0 12 * * *'   # LATAM mañana → 9am ARG / 10am UY / 8am CL
    - cron: '0 17 * * *'   # LATAM tarde → 2pm ARG / 6pm Portugal verano
    - cron: '0 22 * * *'   # EU noche → 23:00 Portugal verano / 22:00 invierno
    - cron: '0 2 * * *'    # LATAM noche → 11pm ARG (Portugal 3am filtrado por TZ)
  workflow_dispatch: # permite correrlo manualmente para probar

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install web-push @supabase/supabase-js node-fetch@2

      - name: Send daily notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/send-push.js
