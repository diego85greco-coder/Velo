name: Copia de seguridad de la base

# El proyecto de Supabase está en plan GRATUITO, que no incluye copias de
# seguridad automáticas. Sin esto, perder la base significaría perder los
# diarios, los ánimos y las conversaciones de todo el mundo sin vuelta atrás.
#
# El volcado se guarda como ARTEFACTO (privado del repositorio), nunca como
# commit: subir el diario íntimo de la gente a git lo dejaría en el historial
# para siempre.

on:
  schedule:
    - cron: '40 3 * * *'   # 03:40 UTC — antes de las limpiezas de las 04:00
  workflow_dispatch:        # y a mano cuando haga falta

permissions:
  contents: write        # para commitear supabase/schema.sql cuando cambie

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Volcar la base a JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/backup.js

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: velo-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

      # La ESTRUCTURA sí va al repositorio, al revés que los datos: no contiene
      # nada de nadie, y un respaldo sólo sirve si vive en un sitio distinto del
      # que se puede perder. Hasta el 13/08/2026 no existía en ninguna parte: 27
      # tablas se habían creado a mano en el panel de Supabase.
      - name: Volcar la estructura a supabase/schema.sql
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/dump-schema.js

      - name: Commitear la estructura si cambió
        run: |
          git config user.name  "velo-backup"
          git config user.email "consultas@heyvelo.app"
          # `git add` ANTES de comparar: `git diff` a secas no ve un archivo
          # nuevo sin seguimiento. La primera ejecución (13/08) salió en verde
          # diciendo «la estructura no cambió» cuando en realidad el archivo no
          # existía todavía y nunca llegó a commitearse.
          git add supabase/schema.sql
          if git diff --cached --quiet -- supabase/schema.sql; then
            echo "La estructura no cambió."
            exit 0
          fi
          git commit -m "Estructura de la base al $(date -u +%d/%m/%Y)

          Volcado automático de velo_dump_schema(). Si aparece un cambio que no
          esperabas, alguien tocó la base desde el panel en vez de escribir una
          migración."
          git push
